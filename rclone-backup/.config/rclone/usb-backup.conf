# ~/.config/rclone/usb-backup.conf
# Configuration for periodic financial backup to VeraCrypt USB drive (myLinux)
# Managed via GNU Stow in rclone-backup package.
# Override machine-specific values in ~/.config/rclone/usb-backup.conf.local

# 1. Mountpoint and Canary verification
USB_MOUNT="/media/veracrypt1"
CANARY_FILE="$USB_MOUNT/.veracrypt_finance_canary"

# 2. Destination path on the USB drive
DEST_DIR="$USB_MOUNT/FinanceBackup"
ARCHIVE_BASE="$USB_MOUNT/Archive"

# 3. Financial Source directories to back up to the USB drive (from decrypted vault)
VAULT_DIR="${VAULT_MOUNT:-$HOME/.local/share/Cryptomator/mnt/FinanceVault}"

BACKUP_SOURCES=(
    "$HOME/Documents/Gutz_joint_gnucash"
    "$VAULT_DIR/tax"
    "$VAULT_DIR/Budget"
    "$VAULT_DIR/Retirement Plans"
    "$VAULT_DIR/Archive 2026 remote"
)

# 4. Transfer flags tuned for USB flash memory + integrity verification
RCLONE_FLAGS=(
    --checksum
    --transfers 4
    --checkers 8
    --exclude "*.LCK"
    --exclude "*.tmp"
    --exclude "*~"
    --stats 5s
    --fast-list
)

# 5. Enable version archiving of modified files
ENABLE_ARCHIVE=true

# 6. Desktop Notifications
NOTIFY_ON_COMPLETION=true
