# ~/.config/rclone/daily-copy.conf
# Configuration for the automated daily rclone copy daemon (myLinux)
# Managed via GNU Stow in rclone-backup package.
# Override machine-specific values in ~/.config/rclone/daily-copy.conf.local

# 1. Rclone Remote Target (Run 'rclone listremotes' to see configured remotes)
RCLONE_REMOTE="gdrive"

# 2. Destination path on remote storage (e.g. gdrive:DailyBackup or gdrive:Backups)
RCLONE_DEST="gdrive:DailyBackup"

# 3. Source directories to back up daily
# Space-separated bash array of directories to copy
BACKUP_SOURCES=(
    "$HOME/Documents"
    # "$HOME/Pictures"
    # "/media/daveg/Lib/Movies"
)

# 4. Performance & Transfer Flags (Optimized based on myComputer/INSTALL_Google_Drive_Backup.md)
RCLONE_FLAGS=(
    --drive-chunk-size 128M
    --transfers 4
    --checkers 8
    --retries 3
    --stats 30s
    --fast-list
)

# 5. Desktop Notifications
# Set to true to receive desktop popup on completion/error (requires notify-send)
NOTIFY_ON_COMPLETION=true
