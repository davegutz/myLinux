# ~/.config/pipewire/pipewire-pulse.conf.d/50-loopback.conf
# Managed by myLinux for CachyOS / Lubuntu screencasting
# Creates a persistent null-sink audio loopback that GUI_screencast recognizes
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=alsa_output.Loopback sink_properties=device.description=Built-in\\ Audio\\ Loopback" flags = [ nofail ] }
]
