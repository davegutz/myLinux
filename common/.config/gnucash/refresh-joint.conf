# ~/.config/gnucash/refresh-joint.conf
# Configuration for GnuCash Joint refresh engine and desktop widget
# Managed by GNU Stow via myLinux

# Local target directory and book file
LOCAL_DIR="$HOME/Documents/Gutz_joint_gnucash"
GNUCASH_FILE="Gutz_joint.gnucash"

# ODS spreadsheet files in the same directory to refresh alongside GnuCash
SPREADSHEET_FILES=(
    "budget avg less invest.ods"
    "categories_as_budget_20220101-20240301.ods"
)

# Google Drive rclone mount path and remote directory hierarchy
GDRIVE_MOUNT="$HOME/gdrive"
REMOTE_BASE_PATH="Finance remote"

# Dedicated remote folder on Google Drive under "Finance remote"
# Exclusively uses: gdrive:Finance remote/Gutz_joint_gnucash
REMOTE_FOLDER="Gutz_joint_gnucash"

# Name of the rclone remote in ~/.config/rclone/rclone.conf
RCLONE_REMOTE="gdrive"

# Safety backup configuration:
# When true, creates a timestamped copy in $BACKUP_DIR before overwriting any local file
CREATE_BACKUP=true
BACKUP_DIR="$LOCAL_DIR/.backups"
MAX_BACKUPS=10

# Desktop notifications via notify-send
NOTIFY=true

# Optional: Sync local changes back to Google Drive when GnuCash exits (default: false)
SYNC_BACK_ON_EXIT=false
