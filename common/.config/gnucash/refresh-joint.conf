# ~/.config/gnucash/refresh-joint.conf
# Configuration for GnuCash Joint refresh engine and desktop widget
# Managed by GNU Stow via myLinux

# --- Troubleshooting & Status Guide ---
# If 'gnucash-refresh --status' reports:
#   * 'Local file MISSING (remote copy available)':
#       Run 'gnucash-refresh -r' to pull/initialize your local copies from Google Drive.
#   * 'Remote file NOT found on Google Drive':
#       Ensure Google Drive is mounted ('Rclone') and verify files exist in:
#       gdrive:Finance remote/Gutz_joint_gnucash/
#   * 'LOCKED (Active session lock)':
#       If left over from a previous crash/reboot, release with 'gnucash-refresh --unlock'
#       or right-click the desktop icon -> 'Release Cloud Lock'.

# Local target directory and book file
LOCAL_DIR="$HOME/Documents/Gutz_joint_gnucash"
GNUCASH_FILE="Gutz_joint.gnucash"

# ODS spreadsheet files in the same directory to refresh alongside GnuCash
SPREADSHEET_FILES=(
    "budget avg less invest.ods"
    "categories_as_budget_20220101-20240301.ods"
)

# Google Drive rclone mount path and remote directory hierarchy
GDRIVE_MOUNT="$HOME/gdrive"
REMOTE_BASE_PATH="Finance remote"

# Dedicated remote folder on Google Drive under "Finance remote"
# Exclusively uses: gdrive:Finance remote/Gutz_joint_gnucash
REMOTE_FOLDER="Gutz_joint_gnucash"

# Name of the rclone remote in ~/.config/rclone/rclone.conf
RCLONE_REMOTE="gdrive"

# Safety backup configuration:
# When true, creates a timestamped copy in $BACKUP_DIR before overwriting any local file
CREATE_BACKUP=true
BACKUP_DIR="$LOCAL_DIR/.backups"
MAX_BACKUPS=10

# Cloud backups:
# When true, also preserves previous versions on Google Drive in .backups/ before pushing
REMOTE_BACKUP=true

# Cloud Session Token (.session_lock)
# Prevents multi-distribution / multi-machine collisions
REMOTE_LOCK_ENABLED=true
STALE_LOCK_HOURS=6

# Bidirectional synchronization settings:
# Sync local saves (Ctrl+S) automatically to Google Drive during active session
SYNC_ON_SAVE=true
DEBOUNCE_SECONDS=5

# Always ensure final local saves are pushed to Google Drive when GnuCash exits
SYNC_ON_EXIT=true

# Desktop notifications via notify-send
NOTIFY=true
