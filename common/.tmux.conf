# ~/.tmux.conf - Unified tmux configuration (myLinux)

# Ensure 256 colors and TrueColor support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support for scrolling and pane selection
set -g mouse on

# Increase history limit
set -g history-limit 50000

# Start window and pane numbering at 1 (more ergonomic)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive pane split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Tmux configuration reloaded."

# Consistent Dark Status Bar (Catppuccin Mocha themed)
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-left-length 20

set -g status-right "#[fg=#bac2de]%Y-%m-%d #[fg=#89b4fa]%H:%M #[bg=#a6e3a1,fg=#11111b,bold] #h "
set -g status-right-length 50

# Window status
setw -g window-status-style "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#11111b,bg=#cba6f7,bold"
setw -g window-status-current-format " #I:#W "

# Pane border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
